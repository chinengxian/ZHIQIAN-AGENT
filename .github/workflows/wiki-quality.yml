name: Wiki 质量门

on:
  pull_request:
    paths:
      - "src/agent_api/knowledge/**"
      - "src/agent_api/quality/**"
      - "tests/eval/**"
      - "tests/test_wiki_*.py"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/wiki-quality.yml"
  push:
    branches: [main]
    paths:
      - "src/agent_api/knowledge/**"
      - "src/agent_api/quality/**"
      - "tests/eval/**"
      - "tests/test_wiki_*.py"
      - "compose.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/wiki-quality.yml"
  schedule:
    # GitHub Actions 使用 UTC；18:30 对应北京时间次日 02:30。
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  light:
    name: Wiki 轻量质量门
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - name: 安装 Python
        run: uv python install 3.11
      - name: 安装依赖
        run: uv sync --frozen --extra dev --extra rerank
      - name: 执行轻量质量门
        run: uv run wiki-quality light

  full:
    name: Wiki 完整质量门
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - name: 安装 Python
        run: uv python install 3.11
      - name: 安装依赖
        run: uv sync --frozen --extra dev --extra rerank
      - name: 启动评测依赖
        run: docker compose up -d --wait --wait-timeout 240 postgres redis etcd minio milvus
      - name: 创建独立评测数据库
        run: |
          if [ "$(docker compose exec -T postgres psql -U agent -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='agent_wiki_test'")" != "1" ]; then
            docker compose exec -T postgres createdb -U agent agent_wiki_test
          fi
      - name: 执行完整质量门
        env:
          AGENT_WIKI_TEST_DATABASE_URL: postgresql+asyncpg://agent:agent@127.0.0.1:5432/agent_wiki_test
        run: uv run wiki-quality full --report-path artifacts/wiki-eval-report.json
      - name: 上传评测报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-eval-report
          path: artifacts/wiki-eval-report.json
          if-no-files-found: warn
          retention-days: 14
      - name: 停止评测依赖
        if: always()
        run: docker compose down
